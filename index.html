<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Pattern Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header (search + toggles) · left rail of topic tabs grouped by family (horizontal strip on phones) · one readable column of pattern cards. Concept: revision notes with a highlighter, code shown like an IDE. */
:root{
  --paper:#f3f5fa; --surface:#ffffff; --sunk:#eaeef7; --ink:#161b2c; --muted:#586079; --line:#dbe0ec;
  --accent:#2d44bd; --accent-soft:#e5e9ff; --accent-ink:#ffffff;
  --hl:#ffe27a; --hl-ink:#3f3200;
  --ok:#17784b; --ok-soft:#dcf3e7; --warn:#9a5800; --warn-soft:#fdebd2; --bad:#b0213a; --bad-soft:#fbe0e5;
  --code-bg:#1e2129; --code-fg:#cdd4e2; --code-line:#2c313c;
  --c-kw:#e39a5d; --c-str:#9cc47c; --c-num:#82b3ea; --c-com:#7f8899; --c-type:#d9b4f5; --c-fn:#f4cb7a;
  --shadow:0 1px 2px rgba(22,27,44,.06),0 4px 14px rgba(22,27,44,.05);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-code:"JetBrains Mono",Consolas,"Cascadia Mono","SFMono-Regular",monospace;
  --rail:252px; --head-h:60px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0f121b; --surface:#161a26; --sunk:#1c2130; --ink:#e3e7f3; --muted:#9ba4bf; --line:#2a3044;
  --accent:#93a5ff; --accent-soft:#232b52; --accent-ink:#0f121b;
  --hl:#5a4914; --hl-ink:#ffe8a6;
  --ok:#5fd39a; --ok-soft:#173528; --warn:#f2b05e; --warn-soft:#3a2a12; --bad:#ff8a9c; --bad-soft:#3d1a22;
  --code-bg:#0b0d13; --code-fg:#cdd4e2; --code-line:#20242f;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark; }}
:root[data-theme="dark"]{
  --paper:#0f121b; --surface:#161a26; --sunk:#1c2130; --ink:#e3e7f3; --muted:#9ba4bf; --line:#2a3044;
  --accent:#93a5ff; --accent-soft:#232b52; --accent-ink:#0f121b;
  --hl:#5a4914; --hl-ink:#ffe8a6;
  --ok:#5fd39a; --ok-soft:#173528; --warn:#f2b05e; --warn-soft:#3a2a12; --bad:#ff8a9c; --bad-soft:#3d1a22;
  --code-bg:#0b0d13; --code-fg:#cdd4e2; --code-line:#20242f;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(var(--head-h) + 16px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--font-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
code,kbd{font-family:var(--font-code);font-size:.86em}
pre,code,.cell,.mono,.eq,pre.jc{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
:not(pre)>code{background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:.05em .35em;white-space:nowrap}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .4em;background:var(--surface);color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--font-display);font-size:20px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.search{position:relative;flex:1 1 280px;min-width:0;max-width:560px;margin-left:auto}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);
  padding:0 70px 0 36px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--muted)}
.search .k{position:absolute;right:10px;top:9px;font-size:12px;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);
  max-height:min(70vh,520px);overflow:auto;padding:6px}
.results .r{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;cursor:pointer}
.results .r:hover,.results .r.sel{background:var(--accent-soft)}
.results .r b{display:block;font-size:14px}
.results .r small{display:block;color:var(--muted);font-size:12px}
.results .r mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 1px}
.results .none{padding:12px;color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px}
.btn{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* shell */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:0;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head-h));height:calc(100vh - var(--head-h));overflow:auto;border-right:1px solid var(--line);
  padding:14px 10px 40px max(10px,env(safe-area-inset-left,0px));background:var(--surface)}
.grp{margin:0 0 12px}
.grp h4{margin:10px 10px 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tab{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--ink)}
.tab:hover{background:var(--sunk)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tab .g{flex:0 0 auto;min-width:42px;text-align:center;font:600 11px/1 var(--font-code);padding:5px 4px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tab[aria-selected="true"] .g{background:var(--accent);color:var(--accent-ink)}
.tab .st{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 80px}
.page{max-width:980px;margin:0 auto}

/* topic header */
.th{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.eyebrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.pill{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
h1{font-family:var(--font-display);font-size:clamp(28px,4vw,38px);line-height:1.1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.core{font-size:17px;max-width:68ch;margin:0;color:var(--ink)}
.recall{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:0 0 18px}
.recall h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.recall ul{margin:0;padding-left:18px;display:grid;gap:4px}
.recall li{max-width:80ch}
.secnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.secnav a{font-size:13px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 10px;border-radius:999px}
.secnav a:hover{border-color:var(--accent);color:var(--accent)}
.secnav a span{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
section.sec{margin-top:30px}
.sec>h2{font-family:var(--font-display);font-size:22px;margin:0 0 4px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec>h2 small{font:500 12px var(--font-body);color:var(--muted)}
.sec>p.sd{margin:0 0 12px;color:var(--muted);max-width:75ch}
.cards{display:grid;gap:14px}

/* pattern card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0;scroll-margin-top:calc(var(--head-h) + 20px)}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.ch{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ch h3{margin:0;font-size:17px;line-height:1.35;font-weight:600;min-width:0;flex:1 1 300px}
.ch h3 .n{font:600 12px var(--font-code);color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
.cx{display:flex;gap:6px;flex-wrap:wrap}
.cx span{font:500 12px/1 var(--font-code);padding:6px 8px;border-radius:7px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.cx span i{font-style:normal;color:var(--muted);margin-right:4px}
.spot{margin:10px 0 0;font-size:14px}
.spot b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.spot mark{background:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 88%,transparent 88%);color:var(--hl-ink);padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.idea{margin:8px 0 0;max-width:82ch}
.idea p{margin:0 0 6px}
.idea ul,.idea ol{margin:4px 0 6px;padding-left:20px}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;padding-left:28px;position:relative;margin:3px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:19px;height:19px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 11px/19px var(--font-code);text-align:center}
.warn{margin:10px 0 0;font-size:13.5px;background:var(--warn-soft);color:var(--ink);border-radius:9px;padding:7px 11px}
.warn b{color:var(--warn)}
.probs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;align-items:center}
.probs b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.probs span{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink);background:var(--paper)}

/* code */
details.code{margin:12px 0 0;border:1px solid var(--code-line);border-radius:11px;background:var(--code-bg);overflow:hidden}
details.code summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 12px;color:#aeb6c8;font:600 12.5px var(--font-code);user-select:none}
details.code summary::-webkit-details-marker{display:none}
details.code summary::before{content:"";width:0;height:0;border-left:6px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;transition:transform .15s}
details.code[open] summary::before{transform:rotate(90deg)}
details.code summary .lang{color:#e39a5d}
details.code summary .ln{color:#7f8899;font-weight:400}
.copy{margin-left:auto;border:1px solid #3a4050;background:transparent;color:#c3cad8;border-radius:7px;font:500 11.5px var(--font-body);padding:3px 9px;cursor:pointer}
.copy:hover{border-color:#e39a5d;color:#e39a5d}
pre{margin:0;overflow-x:auto;padding:4px 14px 14px;font:13px/1.55 var(--font-code);color:var(--code-fg);tab-size:4}
pre .kw{color:var(--c-kw)} pre .str{color:var(--c-str)} pre .num{color:var(--c-num)} pre .com{color:var(--c-com);font-style:italic}
pre .ty{color:var(--c-type)} pre .fn{color:var(--c-fn)} pre .an{color:#bbb529}

/* view switch */
.vsw{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:38px}
.vsw button{border:0;background:var(--surface);padding:0 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.vsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* short-view table */
.ft.st th:nth-child(1){width:42px}.ft.st th:nth-child(2){width:17%}.ft.st th:nth-child(3){width:25%}.ft.st th:nth-child(5){width:118px}
.ft.st td.num{font:600 12px var(--font-code);color:var(--muted)}
.ft.st td.m code{font-size:12px;white-space:normal}
.tolong{border:0;background:none;padding:0;text-align:left;font:600 13.5px var(--font-body);color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.ft.st tr:target,.ft.st tr.flash{animation:flash 1.6s ease-out}
/* flowchart */
.flow{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.flow li{position:relative}
.flow .fstart,.flow .fend{border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.flow .fend{background:var(--sunk);color:var(--ink);font-weight:400;border:1px dashed var(--line);margin-top:6px;border-radius:10px}
.flow .fstart{margin-bottom:22px}
.flow .fstart::after{content:"";position:absolute;left:28px;top:100%;height:22px;border-left:2px solid var(--line)}
.flow .fq{display:grid;grid-template-columns:minmax(0,340px) auto auto;align-items:center;gap:10px;padding-bottom:26px}
.flow .fq::after{content:"";position:absolute;left:28px;top:calc(100% - 26px);height:26px;border-left:2px solid var(--line)}
.flow .q{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--ink);padding:8px 12px;border-radius:10px;font-size:14px;transform:skewX(-6deg)}
.flow .q{transform:none;border-radius:4px 14px 4px 14px}
.flow .yes{font:600 12px var(--font-code);color:var(--ok);white-space:nowrap}
.flow .ans{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:4px 12px;font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap}
.flow .ans:hover{filter:brightness(1.1);text-decoration:underline}
.flow .no{position:absolute;left:36px;bottom:5px;font:600 11px var(--font-code);color:var(--muted)}
.flowsec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px 16px;margin-top:18px}
.flowsec>h2{font-size:19px}
@media (max-width:640px){ .flow .fq{grid-template-columns:minmax(0,1fr);gap:4px} .flow .yes{padding-left:4px} .flow .ans{justify-self:start;white-space:normal} }
/* card as a table */
.ct{width:100%;border-collapse:collapse;margin:10px 0 0;font-size:14.5px}
.ct th,.ct td{border:0;border-top:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.ct tr:first-child th,.ct tr:first-child td{border-top:0}
.ct th{width:118px;background:none;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;white-space:nowrap;padding-left:0}
.ct td p{margin:0 0 6px}.ct td p:last-child{margin:0}
.ct td ul,.ct td ol{margin:2px 0;padding-left:20px}
.ct mark{background:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 88%,transparent 88%);color:var(--hl-ink);padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ct tr.w td{background:var(--warn-soft);border-radius:8px}
.ct tr.w th{color:var(--warn)}
.ct .probs{margin:0}
.cxi{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.cxi code{font-size:12.5px}
.cxi span{font-size:12px;color:var(--muted);margin-right:8px}
/* reference tables with a code column */
.ftw{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;margin-top:8px}
.ft{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.ft th{background:var(--sunk)}
.ft td{border-bottom:1px solid var(--line);padding:8px 12px;vertical-align:top;overflow-wrap:anywhere}
.ft tr:last-child td{border-bottom:0}
.ft td.fn{font:600 13px var(--font-code);color:var(--accent)}
.ft td.fn code{background:none;border:0;padding:0;color:inherit;white-space:normal}
.ft td ul{margin:0;padding-left:18px}
.ft td :not(pre)>code,.ft td>code,.ct td code{white-space:normal}
.ft td.fc{padding:6px 8px}
.ft col.c1{width:24%}
pre.jc{margin:0;padding:7px 10px;border-radius:8px;background:var(--code-bg);color:var(--code-fg);font:12.5px/1.5 var(--font-code);white-space:pre-wrap;overflow-wrap:anywhere}
.ft:not(.edge):not(.st) th:nth-child(1){width:21%} .ft:not(.edge):not(.st) th:nth-child(2){width:27%}
.ft.edge th:nth-child(1){width:15%} .ft.edge th:nth-child(2){width:15%} .ft.edge th:nth-child(3){width:20%} .ft.edge th:nth-child(4){width:22%}
@media (max-width:760px){
  .ct th{width:auto;display:block;padding:8px 0 0}.ct td{display:block;padding:2px 0 8px;border-top:0}.ct tr{display:block;border-top:1px solid var(--line)}.ct tr:first-child{border-top:0}
  .ft,.ft tbody,.ft tr,.ft td{display:block;width:100%}.ft thead{display:none}
  .ft tr{border-bottom:1px solid var(--line);padding:6px 0}.ft td{border:0;padding:4px 12px}
  .ft td:not(.fn)::before{content:attr(data-l);display:block;font:600 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
}
/* diagrams */
.dia{margin:12px 0 0;padding:12px 14px;border:1px dashed var(--line);border-radius:11px;background:var(--paper);overflow-x:auto}
.dia figcaption,.dia .cap{font-size:12.5px;color:var(--muted);margin-top:6px}
.dia svg{display:block;max-width:100%;height:auto;color:var(--ink)}
.dia svg text{font-family:var(--font-code);font-size:12px;fill:currentColor}
.dia svg .acc{stroke:var(--accent);fill:var(--accent)} .dia svg .accs{stroke:var(--accent)} .dia svg .accf{fill:var(--accent)}
.dia svg .soft{fill:var(--accent-soft)} .dia svg .hlf{fill:var(--hl)} .dia svg .surf{fill:var(--surface)} .dia svg .mut{fill:var(--muted)}
.rows{display:grid;gap:8px}
.arr{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 10px}
.arr>.note{flex:1 1 170px;min-width:0}
.arr .lab{font:600 12px var(--font-code);color:var(--muted);padding-top:7px;min-width:42px;white-space:nowrap}
.arr .cells{display:flex}
.cellw{display:flex;flex-direction:column;align-items:center;min-width:34px}
.cellw .ix{font:11px var(--font-code);color:var(--muted);height:15px}
.cell{width:34px;height:32px;display:grid;place-items:center;border:1.5px solid var(--line);margin-left:-1.5px;background:var(--surface);font:600 13px var(--font-code);color:var(--ink)}
.cellw:first-child .cell{margin-left:0;border-radius:7px 0 0 7px}
.cellw:last-child .cell{border-radius:0 7px 7px 0}
.cell.on{background:var(--accent-soft);border-color:var(--accent);position:relative;z-index:1;color:var(--accent)}
.cell.hl{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);position:relative;z-index:1}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);position:relative;z-index:1}
.cell.dim{color:var(--muted);opacity:.45}
.cellw .pt{font:600 11px var(--font-code);color:var(--accent);height:16px;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);padding-top:7px}
.ll{display:flex;align-items:center;flex-wrap:nowrap;gap:0;font:600 13px var(--font-code)}
.ll .nd{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;position:relative}
.ll .nd.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ll .nd.hl{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.ll .ar{color:var(--muted);padding:0 6px}
.ll .nd sup{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--accent);white-space:nowrap}
.llwrap{padding-top:14px}
.mono{font-family:var(--font-code);font-size:13px}

/* tables */
.tw{overflow-x:auto;margin:10px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.m{font-family:var(--font-code);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.g1{color:var(--ok);font-weight:600}.g2{color:var(--ink)}.g3{color:var(--warn);font-weight:600}.g4{color:var(--bad);font-weight:600}
.yes{color:var(--ok);font-weight:600}.no{color:var(--bad);font-weight:600}
td a.jump{font-weight:500;text-decoration:none;border-bottom:1px dashed var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px;margin-top:10px}
.fbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.fbox h4{margin:0 0 6px;font-size:14px}
.fbox p{margin:0;font-size:13.5px;color:var(--muted)}
.order{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.order button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 10px;cursor:pointer;font-size:13px}
.order button:hover{border-color:var(--accent);color:var(--accent)}
.order button b{font-family:var(--font-code);font-size:11.5px;color:var(--muted);margin-right:6px}
.foot{margin-top:40px;font-size:12.5px;color:var(--muted)}

@media (max-width:900px){
  :root{--head-h:104px}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head-h));height:auto;z-index:15;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);
    padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));scrollbar-width:thin}
  .grp{display:contents}
  .grp h4{display:none}
  .tab{width:auto;flex:0 0 auto;padding:6px 10px;border:1px solid var(--line);white-space:nowrap}
  .tab .st{display:none}
  .tab .g{min-width:0}
  html{scroll-padding-top:calc(var(--head-h) + 70px)}
  .card{scroll-margin-top:calc(var(--head-h) + 70px)}
  .search{flex-basis:100%;max-width:none;order:3}
  .tools{margin-left:auto}
  .brand span{display:none}
}
@media (max-width:520px){ .card{padding:14px} .ch h3{flex-basis:100%} .btn .t{display:none} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

pre,pre *,code,.cell,.eq,.mono{font-variant-ligatures:none!important;font-feature-settings:"liga" 0,"calt" 0!important}
@media (max-width:760px){ .ft.st td.num::before{content:none} .ft.st td.num{padding-bottom:0} }

<script>
/* ---------- content store + helpers used by every topic block ---------- */
window.T = [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rng = x => { const out=[]; (Array.isArray(x)?x:(x==null?[]:[x])).forEach(v=>{ if(typeof v==='string'&&v.includes('-')){const [a,b]=v.split('-').map(Number); for(let i=a;i<=b;i++) out.push(i);} else out.push(Number(v)); }); return out; };
/* figure wrapper */
function D(cap, ...parts){ return `<figure class="dia"><div class="rows">${parts.join('')}</div>${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`; }
/* array strip: A('2 7 11 15',{lab:'a', on:[0], hl:['1-2'], ok:[], bad:[], dim:[], p:{0:'L'}, ix:false, note:''}) */
function A(vals, o={}){
  const a = Array.isArray(vals) ? vals : String(vals).split(' ');
  const S = {}; ['on','hl','ok','bad','dim'].forEach(k => S[k] = rng(o[k]));
  const showIx = o.ix !== false, showP = !!o.p;
  const cells = a.map((v,i) => {
    const cls = ['cell']; for (const k in S) if (S[k].includes(i)) cls.push(k);
    return `<div class="cellw">${showIx?`<span class="ix">${(o.i0||0)+i}</span>`:''}<div class="${cls.join(' ')}">${esc(v)}</div>${showP?`<span class="pt">${o.p[i]!=null?esc(o.p[i]):''}</span>`:''}</div>`;
  }).join('');
  return `<div class="arr">${o.lab!=null?`<span class="lab">${esc(o.lab)}</span>`:''}<div class="cells">${cells}</div>${o.note?`<span class="note">${o.note}</span>`:''}</div>`;
}
/* linked list: LL('1 2 3 null',{on:[1], hl:[2], p:{0:'head'}}) */
function LL(vals, o={}){
  const a = Array.isArray(vals) ? vals : String(vals).split(' ');
  const on = rng(o.on), h = rng(o.hl);
  const body = a.map((v,i) => {
    const node = v==='null' ? `<span class="nul">null</span>` : `<span class="nd${on.includes(i)?' on':''}${h.includes(i)?' hl':''}">${esc(v)}${o.p&&o.p[i]!=null?`<sup>${esc(o.p[i])}</sup>`:''}</span>`;
    const arrow = i<a.length-1 ? `<span class="ar">${o.dbl?'⇄':(o.rev&&o.rev.includes(i)?'←':'→')}</span>` : '';
    return node + arrow;
  }).join('');
  return `<div class="arr">${o.lab!=null?`<span class="lab">${esc(o.lab)}</span>`:''}<div class="llwrap"><div class="ll">${body}</div></div>${o.note?`<span class="note">${o.note}</span>`:''}</div>`;
}
/* vertical stack, bottom→top given: STK('1 3 5',{cap:'stack', on:[2]}) */
function STK(vals, o={}){
  const a = Array.isArray(vals) ? vals : String(vals).split(' ').filter(Boolean);
  const on = rng(o.on), h = rng(o.hl);
  const cells = a.map((v,i)=>`<div class="cell${on.includes(i)?' on':''}${h.includes(i)?' hl':''}">${esc(v)}</div>`).reverse().join('');
  return `<div class="stk">${cells || '<div class="cell dim">empty</div>'}<div class="cap2">${esc(o.cap||'stack')}</div></div>`;
}
/* small table, first row = header: GRID([['','a','b'],['a',1,0]],{on:['1,1'], hl:[]}) */
function GRID(rows, o={}){
  const on = o.on||[], h = o.hl||[], dim = o.dim||[];
  const body = rows.map((r,ri) => `<tr>${r.map((c,ci) => {
    const head = (ri===0 && o.head!==false) || (ci===0 && o.side!==false);
    const key = ri+','+ci;
    const cls = on.includes(key)?'on':h.includes(key)?'hl':dim.includes(key)?'dim':'';
    return head ? `<th>${esc(c)}</th>` : `<td class="${cls}">${esc(c)}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="tw" style="display:inline-block;border:0;background:none"><table class="dp">${body}</table></div>`;
}
let __sid = 0;
/* binary tree from heap-indexed array (children of i at 2i+1, 2i+2; null = missing) */
function TREE(a, o={}){
  const n = a.length, depth = Math.floor(Math.log2(n)) + 1, gapY = o.gy || 56;
  const longest = Math.max(...a.map(v => v==null?0:String(v).length));
  const unit = Math.max(44, longest*8 + 18);
  const W = o.w || Math.max(200, Math.pow(2, depth-1) * unit), H = (depth-1)*gapY + 46;
  const on = rng(o.on), h = rng(o.hl);
  const pos = i => { const d = Math.floor(Math.log2(i+1)), k = i+1-Math.pow(2,d), slots = Math.pow(2,d); return [ (k+.5)*W/slots, 22 + d*gapY ]; };
  let e='', v='';
  for (let i=0;i<n;i++){
    if (a[i]==null) continue;
    const [x,y] = pos(i);
    [2*i+1, 2*i+2].forEach((c,side) => {
      if (c<n && a[c]!=null){ const [cx,cy]=pos(c);
        e += `<line x1="${x}" y1="${y}" x2="${cx}" y2="${cy}" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/>`;
        if (o.el) e += `<text x="${(x+cx)/2 + (side?8:-8)}" y="${(y+cy)/2 - 2}" text-anchor="${side?'start':'end'}" class="mut" style="font-size:10.5px">${esc(o.el[side])}</text>`;
      }
    });
    const s = String(a[i]), cls = on.includes(i) ? 'soft accs' : h.includes(i) ? 'hlf' : 'surf';
    if (s.length <= 2) v += `<circle cx="${x}" cy="${y}" r="15" class="${cls}" stroke="currentColor" stroke-width="1.5"/>`;
    else { const w = s.length*7.6 + 14; v += `<rect x="${x-w/2}" y="${y-13}" width="${w}" height="26" rx="13" class="${cls}" stroke="currentColor" stroke-width="1.5"/>`; }
    v += `<text x="${x}" y="${y+4}" text-anchor="middle">${esc(s)}</text>`;
    if (o.lab && o.lab[i]!=null) v += `<text x="${x+ (s.length<=2?19:s.length*3.8+11)}" y="${y-10}" class="accf" style="font-size:11px">${esc(o.lab[i])}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(o.aria||'tree diagram')}">${e}${v}</svg>`;
}
/* graph with hand-placed nodes: GRAPH({A:[30,30],...},[['A','B','4'],...],{dir:true, on:[edgeIdx], hl:['A'], w:320, h:160}) */
function GRAPH(nodes, edges, o={}){
  const W=o.w||320, H=o.h||160, r=o.r||15, id='m'+(++__sid);
  const on = o.on||[], hl = o.hl||[], hn = o.on2||[];
  let defs = o.dir ? `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="${id}a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accf"/></marker></defs>` : '';
  let e='', v='';
  edges.forEach((ed,i) => {
    const [a,b,lab] = ed, [x1,y1]=nodes[a], [x2,y2]=nodes[b];
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
    const sx=x1+ux*r, sy=y1+uy*r, ex=x2-ux*(r+(o.dir?2:0)), ey=y2-uy*(r+(o.dir?2:0));
    const act = on.includes(i);
    e += `<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" ${act?'class="accs" stroke-width="2.5"':'stroke="currentColor" stroke-opacity=".5" stroke-width="1.5"'} ${o.dir?`marker-end="url(#${id}${act?'a':''})"`:''}/>`;
    if (lab!=null && lab!=='') { const mx=(x1+x2)/2 - uy*10, my=(y1+y2)/2 + ux*10 + 4; e += `<text x="${mx.toFixed(1)}" y="${my.toFixed(1)}" text-anchor="middle" class="${act?'accf':'mut'}" style="font-size:11px">${esc(lab)}</text>`; }
  });
  for (const k in nodes){ const [x,y]=nodes[k]; const isH = hl.includes(k), isN = hn.includes(k);
    v += `<circle cx="${x}" cy="${y}" r="${r}" class="${isH?'soft accs':isN?'hlf':'surf'}" stroke="currentColor" stroke-width="1.5"/><text x="${x}" y="${y+4}" text-anchor="middle">${esc(o.names&&o.names[k]!=null?o.names[k]:k)}</text>`;
    if (o.lab && o.lab[k]!=null){
      const lp = (o.lp && o.lp[k]) || 'below';
      const [lx, ly, anc] = lp==='above' ? [x, y-r-6, 'middle'] : lp==='right' ? [x+r+5, y+4, 'start'] : lp==='left' ? [x-r-5, y+4, 'end'] : [x, y+r+14, 'middle'];
      v += `<text x="${lx}" y="${ly}" text-anchor="${anc}" class="accf" style="font-size:11px">${esc(o.lab[k])}</text>`;
    }
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(o.aria||'graph diagram')}">${defs}${e}${v}</svg>`;
}
/* key → value chips (hash maps, buckets) */
function KV(pairs, o={}){ const on=o.on||[]; return `<div class="arr">${o.lab!=null?`<span class="lab">${esc(o.lab)}</span>`:''}<div class="kvs">${pairs.map((p,i)=>`<span class="kv${on.includes(i)?' on':''}">${esc(p[0])}<i> ${o.sep||'→'} </i>${esc(p[1])}</span>`).join('')}</div>${o.note?`<span class="note">${o.note}</span>`:''}</div>`; }
function NOTE(html){ return `<div class="note" style="padding-top:2px">${html}</div>`; }
function ROW(...parts){ return `<div class="stkrow">${parts.join('')}</div>`; }
/* bars (histogram / rain water): BARS([2,1,5],{water:[0,1,0], on:[2], rect:[l,r,height]}) */
function BARS(h, o={}){
  const u = o.u||16, bw = o.bw||24, gap = 2, wat = o.water||[], on = o.on||[];
  const max = Math.max(1, ...h.map((x,i) => x + (wat[i]||0)), o.rect ? o.rect[2] : 0);
  const W = h.length*(bw+gap) + 10, base = max*u + 4, H = base + 18;
  let s = '';
  h.forEach((v,i) => {
    const x = 5 + i*(bw+gap), wv = wat[i]||0;
    if (wv) s += `<rect x="${x}" y="${base-(v+wv)*u}" width="${bw}" height="${wv*u}" class="soft accs" stroke-width=".8"/>`;
    if (v) s += `<rect x="${x}" y="${base-v*u}" width="${bw}" height="${v*u}" class="${on.includes(i)?'accf':'mut'}" fill-opacity="${on.includes(i)?1:.5}"/>`;
    s += `<text x="${x+bw/2}" y="${base+14}" text-anchor="middle" class="mut" style="font-size:10.5px">${v}</text>`;
  });
  if (o.rect){ const [l,r,ht] = o.rect; s += `<rect x="${5+l*(bw+gap)}" y="${base-ht*u}" width="${(r-l+1)*(bw+gap)-gap}" height="${ht*u}" fill="none" class="accs" stroke-width="2" stroke-dasharray="5 3"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(o.aria||'bar heights')}">${s}</svg>`;
}
/* intervals on a number line: IV([[1,3],[2,6,'hlf']],{max:20}) */
function IV(rows, o={}){
  const max = o.max||20, W = o.w||440, pad = 16, sx = (W - 2*pad - 40)/max, rh = 20;
  let s = '';
  rows.forEach((r,i) => { const [a,b,c] = r, y = 8 + i*rh;
    s += `<rect x="${pad+a*sx}" y="${y}" width="${Math.max(4,(b-a)*sx)}" height="11" rx="5.5" class="${c||'soft accs'}" stroke-width="1.5"/><text x="${pad+b*sx+6}" y="${y+10}" style="font-size:11px">[${a},${b}]</text>`; });
  const ay = 8 + rows.length*rh + 4, H = ay + 16;
  s += `<line x1="${pad}" x2="${pad+max*sx}" y1="${ay}" y2="${ay}" stroke="currentColor" stroke-opacity=".35"/>`;
  for (let t=0; t<=max; t+=(o.step||5)) s += `<text x="${pad+t*sx}" y="${ay+13}" text-anchor="middle" class="mut" style="font-size:10px">${t}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(o.aria||'intervals on a number line')}">${s}</svg>`;
}
</script>

 <div class="fbox"><h4>1 · Recall before you look</h4><p>Read a card’s <b>Spot it</b> line and say the idea out loud. Code stays folded until you open it.</p></div>

</div>
<section class="sec"><h2>Constraints tell you the complexity</h2><p class="sd">Java does roughly 10⁸ simple operations per second. Match n to a target before choosing a pattern.</p>
<div class="tw"><table><thead><tr><th>n up to</th><th>Target</th><th>Usually means</th></tr></thead><tbody>
<tr><td class="m">10 – 12</td><td class="m g4">O(n!)</td><td>Permutations, full backtracking</td></tr>
<tr><td class="m">20 – 25</td><td class="m g4">O(2ⁿ)</td><td>Subsets, bitmasks, pick / not pick</td></tr>
<tr><td class="m">100 – 500</td><td class="m g3">O(n³)</td><td>Floyd-Warshall, partition (MCM) DP</td></tr>
<tr><td class="m">10³ – 5·10³</td><td class="m g3">O(n²)</td><td>2D DP, nested loops, LIS O(n²)</td></tr>
<tr><td class="m">10⁵ – 10⁶</td><td class="m g2">O(n log n) / O(n)</td><td>Sorting, binary search, heap, two pointers, sliding window, hashing</td></tr>
<tr><td class="m">10⁹ – 10¹⁸</td><td class="m g1">O(log n) / O(√n)</td><td>Binary search on answer, fast power, maths</td></tr>
</tbody></table></div></section>
<section class="sec"><h2>Signal → pattern</h2><p class="sd">The phrase in the problem on the left points to the card on the right.</p>

void readMatrix() {
    // input:

    // 1 2 3
    // 4 5 6
    // #.#
    // ..#

    int r = sc.nextInt(), c = sc.nextInt();

void readTestCases() {
    // input:
    // 2
    // 3
    // 1 2 3
    // 2
    // 10 20
    Scanner sc = new Scanner(System.in);
    int t = sc.nextInt();
    while (t-- > 0) {
        int n = sc.nextInt();
        long sum = 0;
        for (int i = 0; i < n; i++) sum += sc.nextLong();
        System.out.println(sum);           // 6, then 30

void readUntilEnd() {

void fastIO() throws java.io.IOException {
    // input:
    // 3
    // 1 2 3
    java.io.BufferedReader br = new java.io.BufferedReader(new java.io.InputStreamReader(System.in));
    StringTokenizer st = new StringTokenizer(br.readLine());
    int n = Integer.parseInt(st.nextToken());
    int[] a = new int[n];
    st = new StringTokenizer(br.readLine());

void mergeSort(int[] a, int lo, int hi) {

void merge(int[] a, int lo, int mid, int hi) {

void quickSort(int[] a, int lo, int hi) {
    if (lo >= hi) return;
    int p = partition(a, lo, hi);
    quickSort(a, lo, p - 1);
    quickSort(a, p + 1, hi);
}
int partition(int[] a, int lo, int hi) {     // pivot = first element
    int pivot = a[lo], i = lo, j = hi;
    while (i < j) {
        while (i <= hi - 1 && a[i] <= pivot) i++;
        while (j >= lo + 1 && a[j] > pivot) j--;
        if (i < j) { int t = a[i]; a[i] = a[j]; a[j] = t; }

    d:'Build a max-heap in O(n), then repeatedly swap the root (max) to the end and sift the new root down in the shrunken heap.',
    c:`
void heapSort(int[] a) {
    int n = a.length;
    for (int i = n / 2 - 1; i >= 0; i--) siftDown(a, i, n);   // build max-heap
    for (int end = n - 1; end > 0; end--) {
        int t = a[0]; a[0] = a[end]; a[end] = t;               // max goes to the end
        siftDown(a, 0, end);
    }
}
void siftDown(int[] a, int i, int n) {
    while (true) {
        int l = 2 * i + 1, r = l + 1, big = i;
        if (l < n && a[l] > a[big]) big = l;
        if (r < n && a[r] > a[big]) big = r;
        if (big == i) return;
        int t = a[i]; a[i] = a[big]; a[big] = t;
        i = big;
    }
}`, tc:'O(n log n)', sc:'O(1)' },

    if (dividend == Integer.MIN_VALUE && divisor == -1) return Integer.MAX_VALUE;  // overflow

    c:`
long countInversions(int[] a) { return sortCount(a, 0, a.length - 1); }
long sortCount(int[] a, int lo, int hi) {
    if (lo >= hi) return 0;
    int mid = (lo + hi) >>> 1;
    long cnt = sortCount(a, lo, mid) + sortCount(a, mid + 1, hi);
    // reverse pairs: before merging, for each i move j while a[i] > 2L * a[j]
    int[] tmp = new int[hi - lo + 1];
    int i = lo, j = mid + 1, k = 0;
    while (i <= mid && j <= hi) {
        if (a[i] <= a[j]) tmp[k++] = a[i++];
        else { cnt += mid - i + 1; tmp[k++] = a[j++]; }
    }
    while (i <= mid) tmp[k++] = a[i++];
    while (j <= hi) tmp[k++] = a[j++];
    System.arraycopy(tmp, 0, a, lo, tmp.length);
    return cnt;
}`, tc:'O(n log n)', sc:'O(n)', p:['Count inversions','Reverse pairs','Count of smaller numbers after self'] },
  { t:'Repeating and missing with two equations', k:'1..n with one value repeated and one missing',
    d:'Let x repeat and y be missing. <code>S − Sn = x − y</code> and <code>S² − S²n = x² − y²</code>. Divide to get <code>x + y</code>, then solve.',
    c:`
int[] findRepeatingMissing(int[] a) {      // returns {repeating, missing}
    long n = a.length, s = 0, s2 = 0;
    for (int v : a) { s += v; s2 += (long) v * v; }
    long d = s - n * (n + 1) / 2;                      // x - y
    long d2 = s2 - n * (n + 1) * (2 * n + 1) / 6;      // x² - y²
    long sum = d2 / d;                                  // x + y
    long x = (d + sum) / 2, y = x - d;
    return new int[]{(int) x, (int) y};
}`, tc:'O(n)', sc:'O(1)', p:['Find the repeating and missing number'], w:'Use <code>long</code> for the squares. The XOR approach avoids overflow altogether.' },

    d:'An even count of negatives keeps the product positive; an odd count means drop a prefix or a suffix. So scan prefix and suffix products together, restarting after a 0.',
    c:`
int maxProduct(int[] a) {
    int n = a.length;
    long pre = 1, suf = 1, best = Long.MIN_VALUE;
    for (int i = 0; i < n; i++) {
        if (pre == 0) pre = 1;
        if (suf == 0) suf = 1;
        pre *= a[i];
        suf *= a[n - 1 - i];
        best = Math.max(best, Math.max(pre, suf));
    }
    return (int) best;
}`, tc:'O(n)', sc:'O(1)', p:['Maximum product subarray'] },

    v:D('Row 4 of Pascal’s triangle (0-based): each term comes from the one before it.', A('1 4 6 4 1',{note:'v · (n − c + 1) / c'})),
    c:`
long nCr(int n, int r) {
    long res = 1;
    for (int i = 0; i < r; i++) res = res * (n - i) / (i + 1);
    return res;
}
List<Long> pascalRow(int n) {              // row n, 0-based
    List<Long> row = new ArrayList<>();

   c:`
List<List<Integer>> threeSum(int[] a) {
    Arrays.sort(a);
    List<List<Integer>> res = new ArrayList<>();
    for (int i = 0; i < a.length - 2; i++) {
        if (i > 0 && a[i] == a[i - 1]) continue;        // skip duplicate first value
        int l = i + 1, r = a.length - 1;
        while (l < r) {
            int s = a[i] + a[l] + a[r];
            if (s < 0) l++;
            else if (s > 0) r--;
            else {
                res.add(Arrays.asList(a[i], a[l], a[r]));
                l++; r--;
                while (l < r && a[l] == a[l - 1]) l++;  // skip duplicates
                while (l < r && a[r] == a[r + 1]) r--;
            }
        }
    }
    return res;
}`, tc:'O(n²) · 4Sum O(n³)', sc:'O(1) extra', p:['3Sum','4Sum (use long for the sum)','3Sum closest'] },

List<Integer> union(int[] a, int[] b) {    // sorted, distinct output
    List<Integer> res = new ArrayList<>();
    int i = 0, j = 0;
    while (i < a.length || j < b.length) {
        int v;
        if (j == b.length || (i < a.length && a[i] <= b[j])) v = a[i++];
        else v = b[j++];
        if (res.isEmpty() || res.get(res.size() - 1) != v) res.add(v);
    }
    return res;
}
List<Integer> intersection(int[] a, int[] b) {
    List<Integer> res = new ArrayList<>();
    int i = 0, j = 0;
    while (i < a.length && j < b.length) {
        if (a[i] < b[j]) i++;
        else if (a[i] > b[j]) j++;
        else { res.add(a[i]); i++; j++; }
    }
    return res;
}`, tc:'O(n + m)', sc:'O(1) extra', p:['Union of two sorted arrays','Intersection of two sorted arrays','Merge sorted array'] },

   d:'Water above bar i is <code>min(maxLeft, maxRight) − h[i]</code>. With two pointers, the side with the lower bar is the bottleneck, so its own running max decides the water there.',
   v:D('Heights [0,1,0,2,1,0,1,3,2,1,2,1] trap 6 units (light cells).', BARS([0,1,0,2,1,0,1,3,2,1,2,1],{water:[0,0,1,0,1,2,1,0,0,1,0,0], u:13, bw:22, aria:'trapped rain water'})),
   c:`
int trap(int[] h) {
    int l = 0, r = h.length - 1, lMax = 0, rMax = 0, water = 0;
    while (l < r) {
        if (h[l] < h[r]) {                 // left is the bottleneck
            lMax = Math.max(lMax, h[l]);
            water += lMax - h[l++];
        } else {

            water += rMax - h[r--];

int lengthOfLongestSubstring(String s) {   // no repeating characters

        if (last[c] >= l) l = last[c] + 1; // jump past the previous copy

        best = Math.max(best, r - l + 1);

String minWindow(String s, String t) {
    int[] need = new int[128];

recall:[

 'On answers: the range is the answer itself (speed, days, distance). Write <code>possible(mid)</code> in O(n) → O(n log range). “Minimize the maximum” or “maximize the minimum” is the giveaway.'
],
html:`<div class="dia" style="margin:0 0 6px">${A('F F F F T T T T',{ix:false, bad:['0-3'], ok:['4-7'], p:{4:'answer'}})}<div class="cap">Every binary search problem reduces to this picture: a predicate that is false, false, …, then true, true, … Binary search finds the first true (or the last false).</div></div>`,

 { h:'BS on 1D arrays', step:'Step 4.1', ps:[
  { t:'Classic binary search', k:'find target in a SORTED array',
    d:'Compare with the middle and throw away the half that cannot contain the target.',
    v:D('Target 6: a[mid] = 7 is too big, so everything from mid rightwards is discarded.', A('3 4 6 7 9 12 16 17',{on:[3], ok:[2], p:{0:'lo', 3:'mid', 7:'hi'}})),
    c:`
int search(int[] a, int target) {
    int lo = 0, hi = a.length - 1;
    while (lo <= hi) {
        int mid = lo + (hi - lo) / 2;
        if (a[mid] == target) return mid;
        if (a[mid] < target) lo = mid + 1;   // target is on the right
        else hi = mid - 1;
    }
    return -1;
}`, tc:'O(log n)', sc:'O(1)', p:['Binary search','Search in a sorted array (recursive version)'] },
  { id:'lower-upper-bound', t:'Lower bound / upper bound family', k:'first or last occurrence, count occurrences, search insert position, floor and ceil',
    d:'<p>Same loop, different condition. When <code>mid</code> satisfies the condition it might be the answer, so save it and keep looking left.</p><ul><li>Search insert / ceil → lower bound</li><li>Floor (largest ≤ x) → upper bound − 1</li><li>Last occurrence → upper bound − 1</li><li>Count of x → ub − lb</li></ul>',
    v:D('x = 2: lower bound is index 1, upper bound is index 4, so 2 occurs 3 times.', A('1 2 2 2 3 5',{hl:['1-3'], p:{1:'lb', 4:'ub'}})),
    c:`
int lowerBound(int[] a, int x) {           // first index with a[i] >= x (n if none)
    int lo = 0, hi = a.length - 1, ans = a.length;
    while (lo <= hi) {
        int mid = lo + (hi - lo) / 2;
        if (a[mid] >= x) { ans = mid; hi = mid - 1; }   // maybe the answer, look left
        else lo = mid + 1;
    }
    return ans;
}
int upperBound(int[] a, int x) {           // first index with a[i] > x
    int lo = 0, hi = a.length - 1, ans = a.length;
    while (lo <= hi) {
        int mid = lo + (hi - lo) / 2;
        if (a[mid] > x) { ans = mid; hi = mid - 1; }

    c:`
int searchRotated(int[] a, int target) {
    int lo = 0, hi = a.length - 1;
    while (lo <= hi) {
        int mid = lo + (hi - lo) / 2;
        if (a[mid] == target) return mid;
        if (a[lo] <= a[mid]) {                         // left half sorted
            if (a[lo] <= target && target < a[mid]) hi = mid - 1;
            else lo = mid + 1;

            else hi = mid - 1;

double findMedianSortedArrays(int[] a, int[] b) {
    if (a.length > b.length) return findMedianSortedArrays(b, a);   // search the smaller one

    int lo = 0, hi = n1;

        int c1 = (lo + hi) >>> 1, c2 = left - c1;
        int l1 = c1 > 0 ? a[c1 - 1] : Integer.MIN_VALUE, r1 = c1 < n1 ? a[c1] : Integer.MAX_VALUE;
        int l2 = c2 > 0 ? b[c2 - 1] : Integer.MIN_VALUE, r2 = c2 < n2 ? b[c2] : Integer.MAX_VALUE;
        if (l1 <= r2 && l2 <= r1) {                       // valid split
            if ((n1 + n2) % 2 == 1) return Math.max(l1, l2);
            return (Math.max(l1, l2) + (double) Math.min(r1, r2)) / 2.0;
        }

int myAtoi(String s) {

    int start = 0, len = 0;
    for (int c = 0; c < s.length(); c++) {

int[] lps(String p) {
    int[] lps = new int[p.length()];
    for (int i = 1, len = 0; i < p.length(); ) {
        if (p.charAt(i) == p.charAt(len)) lps[i++] = ++len;
        else if (len > 0) len = lps[len - 1];    // fall back, keep i
        else lps[i++] = 0;
    }
    return lps;
}

    int[] lps = lps(p);

        left[i] = st.isEmpty() ? i + 1 : i - st.peek();
        st.push(i);

    st.clear();
    for (int i = n - 1; i >= 0; i--) {               // next strictly smaller

        right[i] = st.isEmpty() ? n - i : st.peek() - i;
        st.push(i);
    }
    long sum = 0;
    for (int i = 0; i < n; i++) sum = (sum + (long) a[i] * left[i] % MOD * right[i]) % MOD;
    return (int) sum;

    d:'The map finds a node in O(1). The list keeps recency: the most recent right after <code>head</code>, the LRU right before <code>tail</code>. Every access moves the node to the front.',
    v:D('Most recent at the front, least recent at the back.', LL('head 7 3 9 tail',{dbl:true, p:{1:'most recent', 3:'evict next'}})),
    c:`
class LRUCache {
    private class Node { int key, val; Node prev, next; Node(int k, int v) { key = k; val = v; } }
    private final int cap;
    private final Map<Integer, Node> map = new HashMap<>();
    private final Node head = new Node(0, 0), tail = new Node(0, 0);   // sentinels
    LRUCache(int capacity) { cap = capacity; head.next = tail; tail.prev = head; }
    int get(int key) {
        Node n = map.get(key);
        if (n == null) return -1;
        remove(n); addFront(n);
        return n.val;
    }
    void put(int key, int value) {
        Node n = map.get(key);
        if (n != null) { n.val = value; remove(n); addFront(n); return; }
        if (map.size() == cap) { Node lru = tail.prev; remove(lru); map.remove(lru.key); }
        n = new Node(key, value);
        addFront(n);
        map.put(key, n);
    }
    private void remove(Node n) { n.prev.next = n.next; n.next.prev = n.prev; }
    private void addFront(Node n) { n.next = head.next; n.prev = head; head.next.prev = n; head.next = n; }
}`, tc:'O(1) per op', sc:'O(capacity)', p:['LRU cache','LFU cache (map of frequency → DLL)'], w:'Shortcut in Java: <code>LinkedHashMap</code> with <code>accessOrder = true</code> and <code>removeEldestEntry</code>. Interviewers usually want the manual version.' }

class CircularQueue {

    private int front = 0, size = 0;
    CircularQueue(int cap) { a = new int[cap]; }

        if (size == a.length) return false;
        a[(front + size) % a.length] = x;
        size++;
        return true;

int[] maxSlidingWindow(int[] a, int k) {

class MinHeap {
    private int[] a = new int[16];
    private int size = 0;
    void push(int x) {
        if (size == a.length) a = Arrays.copyOf(a, size * 2);
        a[size] = x;
        int i = size++;
        while (i > 0 && a[(i - 1) / 2] > a[i]) {        // sift up
            swap(i, (i - 1) / 2);
            i = (i - 1) / 2;
        }
    }
    int pop() {                                         // caller checks size > 0
        int top = a[0];
        a[0] = a[--size];
        int i = 0;
        while (true) {                                  // sift down
            int l = 2 * i + 1, r = l + 1, s = i;
            if (l < size && a[l] < a[s]) s = l;
            if (r < size && a[r] < a[s]) s = r;
            if (s == i) break;
            swap(i, s);
            i = s;
        }
        return top;
    }
    int peek() { return a[0]; }
    private void swap(int i, int j) { int t = a[i]; a[i] = a[j]; a[j] = t; }

class BitNode { BitNode[] next = new BitNode[2]; }
int findMaximumXOR(int[] a) {
    BitNode root = new BitNode();
    for (int x : a) {
        BitNode cur = root;
        for (int b = 31; b >= 0; b--) {
            int bit = (x >>> b) & 1;
            if (cur.next[bit] == null) cur.next[bit] = new BitNode();
            cur = cur.next[bit];
        }
    }
    int best = 0;
    for (int x : a) {
        BitNode cur = root;
        int val = 0;
        for (int b = 31; b >= 0; b--) {
            int bit = (x >>> b) & 1;
            if (cur.next[1 - bit] != null) { val |= (1 << b); cur = cur.next[1 - bit]; }
            else cur = cur.next[bit];
        }
        best = Math.max(best, val);
    }
    return best;
}`, tc:'O(32 · n)', sc:'O(32 · n)', p:['Maximum XOR of two numbers in an array','Maximum XOR with an element from array (sort queries by limit, insert offline)'] }

    List<List<Integer>> adj = new ArrayList<>();

List<Integer> bfs(List<List<Integer>> adj, int src) {
    boolean[] vis = new boolean[adj.size()];
    List<Integer> order = new ArrayList<>();
    Queue<Integer> q = new ArrayDeque<>();
    q.offer(src); vis[src] = true;                     // mark when enqueued
    while (!q.isEmpty()) {
        int u = q.poll();
        order.add(u);
        for (int v : adj.get(u)) if (!vis[v]) { vis[v] = true; q.offer(v); }
    }
    return order;
}
void dfs(List<List<Integer>> adj, int u, boolean[] vis, List<Integer> order) {

    for (int s = 0; s < n; s++) {
        if (color[s] != -1) continue;
        Queue<Integer> q = new ArrayDeque<>();
        q.offer(s);

        while (!q.isEmpty()) {
            int u = q.poll();
            for (int v : graph[u]) {

int[] dijkstra(List<List<int[]>> adj, int src) {   // adj.get(u) = list of {v, w}
    int n = adj.size();
    int[] dist = new int[n];
    Arrays.fill(dist, Integer.MAX_VALUE);
    PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> Integer.compare(a[0], b[0]));  // {dist, node}
    dist[src] = 0;

            int v = e[0], w = e[1];

int[] bellmanFord(int n, int[][] edges, int src) {   // edges {u, v, w}; null = negative cycle
    final int INF = Integer.MAX_VALUE;
    int[] dist = new int[n];
    Arrays.fill(dist, INF);
    dist[src] = 0;
    for (int i = 0; i < n - 1; i++)
        for (int[] e : edges)

    for (int[] e : edges)

    return dist;
}
void floydWarshall(int[][] d) {            // d[i][j] = weight, or INF = 1e9 if no edge

    c:`
class DSU {
    int[] parent, size;
    DSU(int n) {
        parent = new int[n];
        size = new int[n];
        for (int i = 0; i < n; i++) { parent[i] = i; size[i] = 1; }
    }
    int find(int x) { return parent[x] == x ? x : (parent[x] = find(parent[x])); }
    boolean union(int a, int b) {
        int ra = find(a), rb = find(b);
        if (ra == rb) return false;                    // already in the same set
        if (size[ra] < size[rb]) { int t = ra; ra = rb; rb = t; }
        parent[rb] = ra;
        size[ra] += size[rb];
        return true;
    }
}`, tc:'O(α(n)) ≈ O(1) per op', sc:'O(n)', p:['Disjoint set (union by rank / size)','Number of operations to make network connected','Accounts merge','Number of islands II','Making a large island','Most stones removed'] },

    d:'<code>tin[u]</code> = DFS discovery time; <code>low[u]</code> = earliest time reachable from u’s subtree using one back edge. Edge u–v is a bridge if <code>low[v] &gt; tin[u]</code>. Node u is an articulation point if <code>low[v] ≥ tin[u]</code> (non-root) or the root has 2+ DFS children.',
    c:`
int timer;
List<List<Integer>> criticalConnections(int n, List<List<Integer>> connections) {
    List<List<Integer>> adj = new ArrayList<>();
    for (int i = 0; i < n; i++) adj.add(new ArrayList<>());
    for (List<Integer> e : connections) { adj.get(e.get(0)).add(e.get(1)); adj.get(e.get(1)).add(e.get(0)); }
    int[] tin = new int[n], low = new int[n];
    boolean[] vis = new boolean[n];
    List<List<Integer>> bridges = new ArrayList<>();
    timer = 0;
    dfs(0, -1, adj, vis, tin, low, bridges);
    return bridges;
}
void dfs(int u, int parent, List<List<Integer>> adj, boolean[] vis, int[] tin, int[] low, List<List<Integer>> bridges) {
    vis[u] = true;
    tin[u] = low[u] = timer++;
    for (int v : adj.get(u)) {
        if (v == parent) continue;
        if (!vis[v]) {
            dfs(v, u, adj, vis, tin, low, bridges);
            low[u] = Math.min(low[u], low[v]);
            if (low[v] > tin[u]) bridges.add(Arrays.asList(u, v));
        } else low[u] = Math.min(low[u], tin[v]);
    }
}`, tc:'O(V + E)', sc:'O(V)', p:['Critical connections (bridges)','Articulation points'] },

    d:'<ol class="steps"><li>DFS and push nodes by finish time.</li><li>Reverse every edge.</li><li>Pop nodes in finish order; each DFS on the reversed graph from an unvisited node marks exactly one SCC.</li></ol>',
    c:`
int kosaraju(List<List<Integer>> adj) {
    int n = adj.size();
    boolean[] vis = new boolean[n];
    Deque<Integer> order = new ArrayDeque<>();
    for (int i = 0; i < n; i++) if (!vis[i]) fill(adj, i, vis, order);      // 1. finish order
    List<List<Integer>> rev = new ArrayList<>();
    for (int i = 0; i < n; i++) rev.add(new ArrayList<>());
    for (int u = 0; u < n; u++) for (int v : adj.get(u)) rev.get(v).add(u);  // 2. reverse edges
    Arrays.fill(vis, false);
    int scc = 0;
    while (!order.isEmpty()) {                                               // 3. DFS on reversed graph
        int u = order.pop();
        if (!vis[u]) { scc++; fill(rev, u, vis, new ArrayDeque<>()); }
    }
    return scc;
}
void fill(List<List<Integer>> g, int u, boolean[] vis, Deque<Integer> st) {
    vis[u] = true;
    for (int v : g.get(u)) if (!vis[v]) fill(g, v, vis, st);
    st.push(u);
}`, tc:'O(V + E)', sc:'O(V + E)', p:['Kosaraju’s algorithm (count / list SCCs)'] }

int waysRec(int n) {                       // 1. recursion: O(2^n)
    if (n <= 1) return 1;
    return waysRec(n - 1) + waysRec(n - 2);
}
int waysMemo(int n, int[] dp) {            // 2. memoization: call with dp filled with -1
    if (n <= 1) return 1;
    if (dp[n] != -1) return dp[n];
    return dp[n] = waysMemo(n - 1, dp) + waysMemo(n - 2, dp);
}
int waysTab(int n) {                       // 3. tabulation
    int[] dp = new int[n + 1];
    dp[0] = 1;
    if (n >= 1) dp[1] = 1;
    for (int i = 2; i <= n; i++) dp[i] = dp[i - 1] + dp[i - 2];
    return dp[n];
}
int waysOpt(int n) {                       // 4. space optimized
    int prev2 = 1, prev = 1;
    for (int i = 2; i <= n; i++) { int cur = prev + prev2; prev2 = prev; prev = cur; }
    return prev;
}`, tc:'O(n)', sc:'O(n) → O(1)', p:['Climbing stairs','Fibonacci'] },

            if (g[i][j] == 1) dp[j] = 0;   // obstacle

int minPathSum(int[][] g) {
    int m = g.length, n = g[0].length;
    int[][] dp = new int[m][n];

        for (int j = 0; j < n; j++) {
            if (i == 0 && j == 0) { dp[i][j] = g[i][j]; continue; }

<script>
(function(){
const FAMS = ['Start','Foundations','Arrays & Strings','Linear structures','Trees','Graphs','Paradigms'];
const $ = s => document.querySelector(s);
const store = {
  get(k,d){ try{ const v = localStorage.getItem('dsa.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('dsa.'+k, JSON.stringify(v)); }catch(e){} }
};
/* ---- tiny Java highlighter (works offline) ---- */
const KW = new Set('abstract assert boolean break byte case catch char class continue default do double else enum extends final finally float for if implements import instanceof int interface long new package private protected public return short static super switch synchronized this throw throws try void volatile while var record true false null'.split(' '));
function hl(code){
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(@[A-Za-z]\w*)|(\b(?:0[xX][\da-fA-F_]+|0[bB][01_]+|\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?)[LlFfDd]?\b)|([A-Za-z_$][\w$]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index)); last = re.lastIndex;
    const t = m[0];
    if (m[1]) out += `<span class="com">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="str">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="an">${t}</span>`;
    else if (m[4]) out += `<span class="num">${t}</span>`;
    else if (KW.has(t)) out += `<span class="kw">${t}</span>`;
    else if (/^[A-Z]/.test(t) && !/^[A-Z0-9_]+$/.test(t)) out += `<span class="ty">${t}</span>`;
    else if (/^\s*\(/.test(code.slice(re.lastIndex, re.lastIndex+3))) out += `<span class="fn">${t}</span>`;
    else out += t;
  }
  return out + esc(code.slice(last));
}
function dedent(s){
  const lines = s.replace(/\t/g,'    ').replace(/^\s*\n/,'').replace(/\s+$/,'').split('\n');
  const ind = Math.min(...lines.filter(l=>l.trim()).map(l=>l.match(/^ */)[0].length));
  return lines.map(l=>l.slice(ind)).join('\n');
}
const slug = s => String(s).toLowerCase().replace(/<[^>]+>/g,'').replace(/&[a-z]+;/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48);
const strip = s => String(s||'').replace(/<[^>]+>/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&[a-z#0-9]+;/g,' ').replace(/\s+/g,' ').trim();

/* ---- prepare data ---- */
T.forEach(t => { let n = 0; (t.secs||[]).forEach(s => s.ps.forEach(p => { n++; p.n = n; p.id = t.id + '--' + (p.id || slug(p.t)); p.sec = s.h; })); t.count = n; });
T.sort((a,b) => (FAMS.indexOf(a.fam) - FAMS.indexOf(b.fam)) || ((a.o||0) - (b.o||0)));

let codeOpen = !!store.get('codeOpen', false), cur = null, booted = false, view = store.get('view', 'short') === 'long' ? 'long' : 'short';

/* ---- rail ---- */
const rail = $('#rail');
rail.innerHTML = FAMS.map(f => {
  const ts = T.filter(t => t.fam === f); if (!ts.length) return '';
  return `<div class="grp" role="tablist" aria-label="${esc(f)}"><h4>${esc(f)}</h4>${ts.map(t => `<button class="tab" type="button" role="tab" id="tab-${t.id}" aria-controls="page" data-t="${t.id}" aria-selected="false"><span class="g" aria-hidden="true">${esc(t.g)}</span><span>${esc(t.name)}</span>${t.count?`<span class="st" title="patterns">${t.count}</span>`:''}</button>`).join('')}</div>`;
}).join('');
rail.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) go(b.dataset.t); });

/* ---- render ---- */
function card(p){
  const code = p.c ? dedent(p.c) : '';
  const d = p.d ? (/^\s*</.test(p.d) ? p.d : `<p>${p.d}</p>`) : '';
  const rows = [];
  if (p.k) rows.push(['Use it when', `<mark>${p.k}</mark>`, '']);
  if (d) rows.push(['How it works', d, '']);
  if (p.tc || p.sc) rows.push(['Time · Space', `<span class="cxi"><code>${esc(p.tc||'—')}</code><span>time</span><code>${esc(p.sc||'—')}</code><span>space</span></span>`, '']);
  if (p.w) rows.push(['Watch out', p.w, 'w']);
  if (p.p && p.p.length) rows.push(['Practice', `<div class="probs">${p.p.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`, '']);
  return `<article class="card" id="${p.id}">
  <div class="ch"><h3><span class="n">${String(p.n).padStart(2,'0')}</span>${p.t}</h3></div>
  <table class="ct"><tbody>${rows.map(r => `<tr class="${r[2]}"><th scope="row">${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</tbody></table>
  ${p.v||''}
  ${code?`<details class="code"${codeOpen?' open':''}><summary><span class="lang">Java</span><span class="ln">${code.split('\n').length} lines</span><button class="copy" type="button">Copy</button></summary><pre><code>${hl(code)}</code></pre></details>`:''}
</article>`;
}
/* reference tables: last column is Java code (escaped + highlighted), the others are HTML */
function ftable(t, tb){
  const cols = tb.cols || ['Function', 'What it does', 'Example'];
  return `<section class="sec" id="${t.id}--${tb.id}"><h2>${esc(tb.h)}</h2>${tb.d?`<p class="sd">${tb.d}</p>`:''}
  <div class="ftw"><table class="ft ${tb.cls||''}"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
  ${tb.rows.map(r => `<tr>${r.map((cell, i) => i === r.length - 1 && tb.code !== false ? `<td class="fc" data-l="${esc(cols[i])}">${cell ? `<pre class="jc">${hl(dedent(cell).replace(/ {2,}(?=\/\/)/g, "  "))}</pre>` : ''}</td>` : `<td data-l="${esc(cols[i])}"${i===0?' class="fn"':''}>${cell}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div></section>`;
}
/* "which pattern?" flowchart */
function flowHtml(t){
  const f = (window.FLOWS || {})[t.id]; if (!f) return '';
  return `<section class="sec flowsec" id="${t.id}-flow"><h2>Which pattern? <small>flowchart</small></h2>
  <ol class="flow"><li class="fstart">Start: read the problem</li>
  ${f.steps.map(s => `<li class="fq"><div class="q">${esc(s[0])}</div><span class="yes">Yes →</span><a class="ans" href="#${t.id}--${s[1]}">${esc(s[2])}</a><span class="no">No ↓</span></li>`).join('')}
  <li class="fend"><b>Otherwise:</b> ${esc(f.end)}</li></ol></section>`;
}
/* short view: one table per section, simple words + key code lines */
function renderShort(t){
  let h = `<div class="th"><div class="eyebrow"><span>${esc(t.fam)}</span>${t.step?`<span class="pill acc">${esc(t.step)}</span>`:''}<span class="pill">Short view</span></div><h1>${esc(t.name)}</h1>${t.core?`<p class="core">${t.core}</p>`:''}</div>`;
  h += flowHtml(t);
  const secs = t.secs || [], tables = t.tables || [];
  const nav = [...tables.map(tb => [`${t.id}--${tb.id}`, tb.h, tb.rows.length]), ...secs.map((s,i) => [`${t.id}-sec${i}`, s.h, s.ps.length])];
  if (nav.length > 1) h += `<div class="secnav" aria-label="Sections">${nav.map(n=>`<button type="button" data-sec="${n[0]}">${esc(n[1])}<span>${n[2]}</span></button>`).join('')}</div>`;
  tables.forEach(tb => { h += ftable(t, tb); });
  secs.forEach((s,i) => {
    h += `<section class="sec" id="${t.id}-sec${i}"><h2>${esc(s.h)}${s.step?`<small>${esc(s.step)}</small>`:''}</h2>
    <div class="ftw"><table class="ft st"><thead><tr><th>#</th><th>Pattern</th><th>In simple words</th><th>Key code</th><th>Time · Space</th></tr></thead><tbody>
    ${s.ps.map(p => { const sh = (window.SHORT || {})[p.id] || [strip(p.k), '']; return `<tr id="s-${p.id}">
      <td class="num" data-l="#">${String(p.n).padStart(2,'0')}</td>
      <td class="fn" data-l="Pattern"><button type="button" class="tolong" data-long="${p.id}" title="Open the full card">${p.t}</button></td>
      <td data-l="In simple words">${sh[0]}</td>
      <td class="fc" data-l="Key code">${sh[1] ? `<pre class="jc">${hl(dedent(sh[1]))}</pre>` : ''}</td>
      <td class="m" data-l="Time · Space"><code>${esc(p.tc||'—')}</code><br><code>${esc(p.sc||'—')}</code></td></tr>`; }).join('')}
    </tbody></table></div></section>`;
  });
  if (t.after) h += t.after;
  h += `<p class="foot">Short view. Click a pattern name, or switch to Long view at the top, for the full explanation, diagram and complete code.</p>`;
  return h;
}
function renderTopic(t){
  if (view === 'short' && ((t.secs||[]).length)) return renderShort(t);
  let h =`<div class="th"><div class="eyebrow"><span>${esc(t.fam)}</span>${t.step?`<span class="pill acc">${esc(t.step)}</span>`:''}${t.count?`<span class="pill">${t.count} patterns</span>`:''}</div><h1>${esc(t.name)}</h1>${t.core?`<p class="core">${t.core}</p>`:''}</div>`;
  if (t.recall) h += `<div class="recall"><h3>Quick recall</h3><ul>${t.recall.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  if (t.html) h += t.html;
  h += flowHtml(t);
  const secs = t.secs || [], tables = t.tables || [];
  const nav = [...tables.map(tb => [`${t.id}--${tb.id}`, tb.h, tb.rows.length]), ...secs.map((s,i) => [`${t.id}-sec${i}`, s.h, s.ps.length])];
  if (nav.length > 1) h += `<div class="secnav" aria-label="Sections">${nav.map(n=>`<button type="button" data-sec="${n[0]}">${esc(n[1])}<span>${n[2]}</span></button>`).join('')}</div>`;
  tables.forEach(tb => { h += ftable(t, tb); });
  secs.forEach((s,i) => { h += `<section class="sec" id="${t.id}-sec${i}"><h2>${esc(s.h)}${s.step?`<small>${esc(s.step)}</small>`:''}</h2>${s.d?`<p class="sd">${s.d}</p>`:''}<div class="cards">${s.ps.map(card).join('')}</div></section>`; });
  if (t.after) h += t.after;
  h += `<p class="foot">Press <kbd>/</kbd> to search from anywhere. Code blocks are templates: rename variables to fit the problem and re-derive the complexity from your loops.</p>`;
  return h;
}
const page = $('#page');
function show(t, cardId){
  if (cur !== t){
    page.innerHTML = renderTopic(t); cur = t; store.set('tab', t.id);
    rail.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === t.id)));
    page.setAttribute('aria-labelledby', 'tab-'+t.id);
    const tb = rail.querySelector(`.tab[data-t="${t.id}"]`);
    if (tb && rail.scrollWidth > rail.clientWidth + 4) tb.scrollIntoView({block:'nearest', inline:'center'});
    if (!cardId) window.scrollTo(0,0);
  }
  if (cardId){
    const el = (view === 'short' && document.getElementById('s-' + cardId)) || document.getElementById(cardId);
    if (el){ setTimeout(()=>{ el.scrollIntoView({block:'start'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }, 0);
      if (!booted && document.fonts && document.fonts.ready) document.fonts.ready.then(()=>el.scrollIntoView({block:'start'})); }
  }
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const tid = h.split('--')[0];
  const t = T.find(x => x.id === tid) || T.find(x => x.id === store.get('tab','')) || T[0];
  show(t, h.includes('--') ? h : null);
}
function go(id){ if (location.hash === '#'+id) route(); else location.hash = id; }
window.addEventListener('hashchange', route);

page.addEventListener('click', e => {
  const cp = e.target.closest('.copy');
  if (cp){
    e.preventDefault(); e.stopPropagation();
    const pre = cp.closest('details').querySelector('pre'); const text = pre.textContent;
    const done = ok => { cp.textContent = ok ? 'Copied' : 'Select + Ctrl+C'; setTimeout(()=>cp.textContent='Copy', 1500); };
    const fallback = () => { const d = cp.closest('details'); d.open = true; const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); done(false); };
    try { navigator.clipboard.writeText(text).then(()=>done(true), fallback); } catch(err){ fallback(); }
    return;
  }
  const sb = e.target.closest('[data-sec]');
  if (sb){ const s = document.getElementById(sb.dataset.sec); if (s) s.scrollIntoView({block:'start'}); return; }
  const tl = e.target.closest('[data-long]');
  if (tl){ setView('long'); go(tl.dataset.long); return; }
  const j = e.target.closest('[data-go]');
  if (j){ e.preventDefault(); go(j.dataset.go); }
});

/* ---- short / long view ---- */
function setView(v){
  if (v === view) return;
  view = v; store.set('view', v);
  document.querySelectorAll('#viewSw button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  if (cur){ const t = cur; cur = null; const y = scrollY; show(t, null); window.scrollTo(0, Math.min(y, 0)); }
}
document.querySelectorAll('#viewSw button').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.v === view)); b.addEventListener('click', () => setView(b.dataset.v)); });

/* ---- code toggle ---- */
const codeBtn = $('#codeAll');
function syncCodeBtn(){ codeBtn.setAttribute('aria-pressed', String(codeOpen)); codeBtn.querySelector('.t').textContent = codeOpen ? 'Hide all code' : 'Show all code'; }
codeBtn.addEventListener('click', () => { codeOpen = !codeOpen; store.set('codeOpen', codeOpen); syncCodeBtn(); page.querySelectorAll('details.code').forEach(d => d.open = codeOpen); });
syncCodeBtn();

/* ---- theme ---- */
const root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
const eff = () => root.dataset.theme || (mq.matches ? 'dark' : 'light');
function syncTheme(){ $('#themeLbl').textContent = eff() === 'dark' ? 'Light' : 'Dark'; }
const saved = store.get('theme', null); if (saved === 'dark' || saved === 'light') root.dataset.theme = saved;
$('#theme').addEventListener('click', () => { const n = eff() === 'dark' ? 'light' : 'dark'; root.dataset.theme = n; store.set('theme', n); syncTheme(); });
if (mq.addEventListener) mq.addEventListener('change', syncTheme);
syncTheme();

/* ---- header height → sticky offsets ---- */
const top = $('#top');
const setH = () => root.style.setProperty('--head-h', top.offsetHeight + 'px');
if (window.ResizeObserver) new ResizeObserver(setH).observe(top); setH();

/* ---- search ---- */
const IDX = [];
T.forEach(t => {
  IDX.push({ type:'topic', t, title:t.name, sub:'Topic · ' + t.fam + (t.step ? ' · ' + t.step : ''), hay:(t.name+' '+(t.alias||'')+' '+strip(t.core)).toLowerCase(), probs:[] });
  (t.secs||[]).forEach(s => s.ps.forEach(p => IDX.push({ type:'p', t, p, title:strip(p.t), sub:t.name+' › '+s.h,
    hay:[strip(p.t), s.h, t.name, t.alias||'', strip(p.k), strip(p.d), (p.p||[]).join(' | '), p.tags||'', p.c||''].join(' ').toLowerCase().replace(/−/g,'-'), probs:p.p||[] })));
  (t.tables||[]).forEach(tb => tb.rows.forEach(r => IDX.push({ type:'row', t, target:`${t.id}--${tb.id}`, title:strip(r[0]), sub:t.name+' › '+tb.h,
    hay:r.map(strip).concat([tb.h, t.name]).join(' ').toLowerCase().replace(/−/g,'-'), probs:[] })));
});
const q = $('#q'), res = $('#results'); let hits = [], sel = 0;
const markIn = (s, words) => { let h = esc(s); words.forEach(w => { if (w.length < 2) return; const r = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig'); h = h.replace(r, '<mark>$1</mark>'); }); return h; };
const STOP = new Set('a an and at by for in is of on or the to with'.split(' '));
const ALIAS = { bs:'binary search', dp:'dynamic programming', ll:'linked list', dsu:'disjoint set', pq:'priority queue', mst:'spanning tree',
  lca:'common ancestor', lis:'increasing subsequence', lcs:'common subsequence', nge:'next greater', pse:'previous smaller', nse:'next smaller',
  mcm:'matrix chain', sw:'sliding window', tp:'two pointer', bt:'binary tree', dll:'doubly', xor:'xor', topo:'topological' };
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function termsOf(w){                       // each query word → alternatives that may match
  const alts = [new RegExp('(^|[^a-z0-9])' + reEsc(w))];
  if (ALIAS[w]) alts.push(new RegExp(reEsc(ALIAS[w])));
  if (w.length > 4) alts.push(new RegExp('(^|[^a-z0-9])' + reEsc(w.slice(0, w.length - Math.min(3, w.length - 4)))));
  return alts;
}
function runSearch(){
  const raw = q.value.toLowerCase().trim();
  let words = raw.split(/\s+/).filter(Boolean);
  const content = words.filter(w => !STOP.has(w));
  if (content.length) words = content;
  if (!words.length){ res.hidden = true; hits = []; return; }
  const terms = words.map(termsOf);
  const scored = [];
  IDX.forEach(it => {
    if (!terms.every(alts => alts.some(r => r.test(it.hay)))) return;
    const tl = it.title.toLowerCase(), sub = it.sub.toLowerCase();
    let sc = it.type === 'topic' ? 4 : 0;
    if (raw.length > 2 && tl.includes(raw)) sc += 12;
    else if (raw.length > 2 && sub.includes(raw)) sc += 8;
    terms.forEach(alts => {
      if (alts[0].test(tl)) sc += 6; else if (alts.some(r => r.test(tl))) sc += 4;
      else if (alts.some(r => r.test(sub))) sc += 3; else sc += 1;
    });
    scored.push([sc, it]);
  });
  hits = scored.sort((a,b) => b[0]-a[0]).slice(0,40).map(x => x[1]); sel = 0;
  res.innerHTML = hits.length ? hits.map((it,i) => {
    const pm = it.probs.find(pr => words.some(w => pr.toLowerCase().includes(w)) && !it.title.toLowerCase().includes(words[0]));
    return `<button type="button" class="r${i===0?' sel':''}" role="option" data-i="${i}"><b>${markIn(it.title, words)}</b><small>${esc(it.sub)}${pm?' · problem: '+markIn(pm, words):''}</small></button>`;
  }).join('') : `<div class="none">No pattern matches “${esc(q.value)}”. Try a problem name (koko, rotten oranges) or an idea (prefix sum, monotonic).</div>`;
  res.hidden = false;
}
function openHit(i){ const it = hits[i]; if (!it) return; res.hidden = true; q.blur(); go(it.type === 'topic' ? it.t.id : it.type === 'row' ? it.target : it.p.id); }
q.addEventListener('input', runSearch);
q.addEventListener('focus', () => { if (q.value.trim()) runSearch(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); if (!hits.length) return; sel = (sel + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length; res.querySelectorAll('.r').forEach((b,i) => b.classList.toggle('sel', i === sel)); const b = res.querySelector('.r.sel'); if (b) b.scrollIntoView({block:'nearest'}); }
  else if (e.key === 'Enter'){ e.preventDefault(); openHit(sel); }
  else if (e.key === 'Escape'){ q.value = ''; res.hidden = true; q.blur(); }
});
res.addEventListener('mousedown', e => e.preventDefault());
res.addEventListener('click', e => { const b = e.target.closest('.r'); if (b) openHit(+b.dataset.i); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); q.select(); }
});

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
route();
booted = true;
})();
</script>

</body>
